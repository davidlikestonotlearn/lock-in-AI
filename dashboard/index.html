<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock In Buddy</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../styleBuddy.css" />
    <!-- appear.js builds the HTML before buddy.js attaches its behavior. -->
    <script src="../appear.js" defer></script>
    <script src="../buddy.js" defer></script>
  </head>
  <body>

    <header class="brand"><span class="brand-icon">✳</span> lock in buddy <span class="prototype">PLAYGROUND</span></header>
    <main class="welcome">
      <p class="eyebrow">A LITTLE COMPANY. A LITTLE MORE FOCUS.</p>
      <h1>Big plans.<br />Little buddy.</h1>
      <p class="intro">Meet your new focus friend. Nudge to get started,<br class="desktop-break" /> stay with it, and chat with buddy.</p>
      <div class="instructions"><span>↗ Drag your buddy anywhere</span><span>☏ Click to check in</span><span>◷ Make a little focus time</span></div>
      <p class="hint">Your buddy is out there floating</p>
    </main>

    <!-- Buddy's button and panel are created by appear.js. -->
  </body>
</html>
